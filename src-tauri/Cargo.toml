[package]
name = "containers"
version = "1.0.0"
description = "App de alquiler de activos — escritorio nativo (Tauri)"
authors = ["Containers"]
edition = "2021"

[lib]
name = "containers_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
